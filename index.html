<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zotero Co-author Network</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: title + stat line, control bar, then a canvas stage with an author panel beside it (stacked below on phones) */
:root {
  --bg: #f3f6f7; --surface: #ffffff; --fg: #15212b; --muted: #5a6873; --line: #d6dee3;
  --accent: #1d6a87; --edge: rgba(21,33,43,.15); --rest: #9fabb3; --fade: rgba(21,33,43,.06);
  --c1: #2763a6; --c2: #c25a10; --c3: #7046c2; --c4: #2f8a4a; --c5: #b8336a; --c6: #94760a; --c7: #138585; --c8: #8a5a3c;
  --display: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1418; --surface: #151d22; --fg: #e3e9ed; --muted: #93a2ad; --line: #26333b;
  --accent: #62b6d4; --edge: rgba(227,233,237,.13); --rest: #52606a; --fade: rgba(227,233,237,.05);
  --c1: #6ea8eb; --c2: #f0924c; --c3: #ab8ef2; --c4: #64c482; --c5: #ea74a2; --c6: #d9b744; --c7: #4cc6c6; --c8: #c99676;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1418; --surface: #151d22; --fg: #e3e9ed; --muted: #93a2ad; --line: #26333b;
  --accent: #62b6d4; --edge: rgba(227,233,237,.13); --rest: #52606a; --fade: rgba(227,233,237,.05);
  --c1: #6ea8eb; --c2: #f0924c; --c3: #ab8ef2; --c4: #64c482; --c5: #ea74a2; --c6: #d9b744; --c7: #4cc6c6; --c8: #c99676;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1400px; margin: 0 auto; padding-block: 24px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; }
header { display: grid; gap: 4px; }
h1 { font-family: var(--display); font-weight: 600; font-size: 1.75rem; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 20px; color: var(--muted); font-family: var(--mono); font-size: .8rem; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 500; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
input, select, button { font: inherit; color: var(--fg); }
input[type=search], select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
input[type=search] { width: min(320px, 80vw); }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; height: clamp(420px, 74vh, 900px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
canvas.dragging { cursor: grabbing; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: .72rem; color: var(--muted); pointer-events: none; }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); padding: 5px 9px; border-radius: 5px; font-size: .78rem; white-space: nowrap; transform: translate(10px, -130%); }

aside { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; min-width: 0; max-height: clamp(420px, 74vh, 900px); overflow-y: auto; }
aside h2 { font-family: var(--display); font-weight: 600; font-size: 1.15rem; margin: 0; text-wrap: balance; }
aside h3 { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.meta { font-family: var(--mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
ul.titles { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: .85rem; }
ul.titles li { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); gap: 8px; align-items: baseline; }
ul.titles .yr { font-family: var(--mono); font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
ul.titles .dup { font-family: var(--mono); font-size: .7rem; color: var(--muted); white-space: nowrap; }
ul.people { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
ul.people button { width: 100%; display: flex; justify-content: space-between; gap: 8px; background: none; border: 0; padding: 4px 6px; border-radius: 5px; cursor: pointer; text-align: left; }
ul.people button:hover { background: var(--fade); color: var(--accent); }
ul.people .n { font-family: var(--mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.note { font-size: .78rem; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head><body>


<div class="wrap">
  <header>
    <h1>Zotero Co-author Network</h1>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <div class="field">
      <label for="q">Find an author</label>
      <input type="search" id="q" list="names" placeholder="e.g. Kate Starbird" autocomplete="off">
      <datalist id="names"></datalist>
    </div>
    <div class="field">
      <label for="minc">Show clusters with</label>
      <select id="minc">
        <option value="1">Any size (all authors)</option>
        <option value="3">3+ authors</option>
        <option value="6">6+ authors</option>
        <option value="12">12+ authors</option>
        <option value="30">30+ authors</option>
      </select>
    </div>
    <button class="btn" id="fit" type="button">Fit to view</button>
  </div>

  <div class="main">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="Co-authorship network of authors in My Library"></canvas>
      <div class="tip" id="tip" hidden></div>
      <div class="hint">Scroll or pinch to zoom · drag to pan · click an author</div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>
</div>

  const back = el('button', { type: 'button', className: 'btn', textContent: '← All authors' }); back.onclick = () => select(null, true);
  panel.append(back, el('h2', { textContent: n.name }),
    el('div', { className: 'meta', textContent: `${n.papers} item${n.papers > 1 ? 's' : ''} · ${n.deg} co-author${n.deg === 1 ? '' : 's'} · cluster of ${n.csize}` }));
  const np = n.titles.length;
  const ti = el('div', {}, el('h3', { textContent: `Papers in your library (${np})` }));
  const ul = el('ul', { className: 'titles' });
  n.titles.forEach(([year, title, copies]) => {
    const body = el('span', { textContent: title + ' ' });
    if (copies > 1) body.append(el('span', { className: 'dup', textContent: `saved ${copies}×` }));
    ul.append(el('li', {}, el('span', { className: 'yr', textContent: year || 'n.d.' }), body));
  });
  ti.append(ul);
  if (n.papers > np) ti.append(el('p', { className: 'note', textContent: `Zotero has ${n.papers} items for these ${np} papers; duplicates are listed once.` }));
  panel.append(ti);
  if (co.length) {
    const box = el('div', {}, el('h3', { textContent: 'Co-authors (shared items)' }));
    const m = new Map(co); box.append(personList(co.map(([i]) => nodes[i]), x => m.get(x.i)));
    panel.append(box);
  } else panel.append(el('p', { className: 'note', textContent: 'No co-authors in your library: every item lists this person alone.' }));
}
function select(n, zoomTo) {
  if (n && !vis.includes(n)) { minSel.value = '1'; build(1); }
  selected = n; renderPanel(); draw();
  panel.scrollTop = 0;
  // On narrow screens the panel sits below the graph, so bring it into view.
  if (n && matchMedia('(max-width: 860px)').matches) panel.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  if (zoomTo) fit(true);
}

const minSel = document.getElementById('minc');
minSel.addEventListener('change', () => { if (selected && selected.csize < +minSel.value) { selected = null; renderPanel(); } build(+minSel.value); });
document.getElementById('fit').addEventListener('click', () => fit(true));
const q = document.getElementById('q');
q.addEventListener('change', () => { const n = byName.get(q.value.trim().toLowerCase()); if (n) select(n, true); });
q.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = q.value.trim().toLowerCase(); if (!v) return;
  const n = byName.get(v) || sorted.find(x => x.name.toLowerCase().includes(v));
  if (n) { q.value = n.name; select(n, true); }
});

// Refit whenever the stage changes size, until the viewer pans or zooms themselves.
new ResizeObserver(() => { resize(); if (sim && !userMoved) fit(false); }).observe(stage);
resize(); build(1); renderPanel();
</script>
